spring:
  application:
    name: qualityops-api

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qualityops}
    username: ${DB_USER:qualityops}
    password: ${DB_PASSWORD:qualityops}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Keeps DB sessions closed until actually needed; prevents N+1 under virtual threads
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Type headers are required so JsonDeserializer knows which record class
        # to deserialize into on the consumer side (producer and consumer share
        # the same event classes in-process today; this also keeps working
        # unchanged once the worker is extracted to its own app in Phase 2+).
        spring.json.add.type.headers: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.qualityops.*"

server:
  port: ${SERVER_PORT:8080}

qualityops:
  jwt:
    # Min 256 bits for HS256. In production use a securely generated Base64-encoded 32-byte secret.
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRz}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY:15}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
